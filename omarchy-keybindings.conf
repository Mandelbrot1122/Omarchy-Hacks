# ============================================================================
#  Omarchy-Keybindings für normales Hyprland
# ============================================================================
#  Alle Tastenkürzel von Omarchy (https://github.com/basecamp/omarchy) in einer
#  Datei, ohne die omarchy-*-Skripte. Jede Funktion läuft über Standard-Tools
#  (wpctl, brightnessctl, playerctl, grim/slurp, hyprlock, cliphist, ...).
#
#  Einbinden: als LETZTE Zeile in ~/.config/hypr/hyprland.conf
#      source = ~/.config/hypr/omarchy-keybindings.conf
#
#  Der Block "Kollisionen entfernen" weiter unten löscht vorher definierte
#  Bindings auf denselben Tasten (z. B. SUPER+M = exit aus der Hyprland-
#  Standardconfig). Eigene Bindings, die gewinnen sollen, NACH der
#  source-Zeile definieren.
#
#  Alle Bindings anzeigen: SUPER + K
# ============================================================================


# ----------------------------------------------------------------------------
#  Programme (install.sh setzt diese automatisch nach dem, was installiert ist)
# ----------------------------------------------------------------------------
$terminal = kitty
$browser = firefox
$privateBrowser = firefox --private-window
$fileManager = nautilus --new-window
$editor = kitty -e nvim
$launcher = wofi --show drun
$dmenu = wofi --dmenu
# Programmname von $launcher/$dmenu: nochmal drücken schließt das Menü
$menuBin = wofi
$emojiPicker = rofimoji
$calculator = gnome-calculator
$audioControl = pavucontrol
$bluetoothControl = blueman-manager
$networkControl = nm-connection-editor
$lock = pidof hyprlock || hyprlock

# Web-Apps öffnen sich als eigenes Fenster (Chromium-basierter Browser mit --app)
$webapp = sh -c 'exec chromium --new-window --app="$1"' _


# ----------------------------------------------------------------------------
#  Hilfsbefehle
# ----------------------------------------------------------------------------
$screenshot = sel=$(slurp -d) && mkdir -p "$HOME/Pictures" && grim -g "$sel" - | tee "$HOME/Pictures/Screenshot_$(date +%Y-%m-%d_%H-%M-%S).png" | wl-copy && notify-send "Screenshot" "Gespeichert und kopiert"

$screenrecord = pkill -INT -x wf-recorder || { sel=$(slurp -d) && mkdir -p "$HOME/Videos" && notify-send "Bildschirmaufnahme" "Gleiche Taste erneut drücken zum Stoppen" && wf-recorder -g "$sel" -f "$HOME/Videos/Aufnahme_$(date +%Y-%m-%d_%H-%M-%S).mp4"; }

$screenrecordAudio = pkill -INT -x wf-recorder || { sel=$(slurp -d) && mkdir -p "$HOME/Videos" && notify-send "Bildschirmaufnahme (mit Ton)" "Gleiche Taste erneut drücken zum Stoppen" && wf-recorder --audio -g "$sel" -f "$HOME/Videos/Aufnahme_$(date +%Y-%m-%d_%H-%M-%S).mp4"; }

$ocr = sel=$(slurp -d) && grim -g "$sel" - | tesseract stdin stdout 2>/dev/null | wl-copy && notify-send "Text erkannt" "In die Zwischenablage kopiert"

$clipboardMenu = cliphist list | $dmenu | cliphist decode | wl-copy

$powerMenu = case "$(printf 'Sperren\nAbmelden\nBereitschaft\nNeustart\nHerunterfahren' | $dmenu)" in Sperren) hyprlock ;; Abmelden) hyprctl dispatch exit ;; Bereitschaft) systemctl suspend ;; Neustart) systemctl reboot ;; Herunterfahren) systemctl poweroff ;; esac

$keybindingsMenu = hyprctl binds -j | jq -r '.[] | select(.has_description) | [([if ((.modmask / 64 | floor) % 2) == 1 then "SUPER" else empty end, if ((.modmask / 4 | floor) % 2) == 1 then "CTRL" else empty end, if ((.modmask / 8 | floor) % 2) == 1 then "ALT" else empty end, if (.modmask % 2) == 1 then "SHIFT" else empty end, (if .key != "" then .key elif (.keycode >= 10 and .keycode <= 19) then ((.keycode - 9) % 10 | tostring) elif .keycode == 49 then "^" elif .keycode == 20 then "-" elif .keycode == 21 then "=" else "code:" + (.keycode | tostring) end)] | join(" + ")), .description] | "\(.[0])\t\(.[1])"' | awk -F '\t' '{ printf "%-32s %s\n", $1, $2 }' | $dmenu

$closeAll = hyprctl clients -j | jq -r '.[].address' | xargs -r -I{} hyprctl dispatch closewindow address:{}

$layoutToggle = if hyprctl getoption general:layout | grep -q dwindle; then hyprctl keyword general:layout master; else hyprctl keyword general:layout dwindle; fi

$gapsToggle = st="$XDG_RUNTIME_DIR/omarchy-keybindings-nogaps"; if [ -e "$st" ]; then rm -f "$st"; hyprctl reload; else touch "$st"; hyprctl --batch "keyword general:gaps_in 0 ; keyword general:gaps_out 0 ; keyword general:border_size 0 ; keyword decoration:rounding 0"; fi

$idleToggle = if pgrep -x hypridle >/dev/null; then pkill -x hypridle; notify-send "Sperre bei Inaktivität" "Aus"; else setsid -f hypridle >/dev/null 2>&1; notify-send "Sperre bei Inaktivität" "An"; fi

$laptopDisplayToggle = mon=$(hyprctl monitors -j | jq -r '[.[] | select(.name | test("^(eDP|LVDS|DSI)"))][0].name // empty'); if [ -n "$mon" ] && [ "$(hyprctl monitors -j | jq length)" -gt 1 ]; then hyprctl keyword monitor "$mon,disable"; else hyprctl reload; fi

$zoomIn = hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')"

$volumeUp = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
$volumeDown = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
$notifyDismiss = makoctl dismiss 2>/dev/null || swaync-client --close-latest


# ----------------------------------------------------------------------------
#  Unterstützende Einstellungen
# ----------------------------------------------------------------------------
# Zwischenablage-Verlauf für SUPER + CTRL + V
exec-once = pgrep -x waybar >/dev/null || waybar
exec-once = wl-paste --watch cliphist store
# Merkt sich den aktiven Mediaplayer (für SHIFT + Play)
exec-once = playerctld daemon
# Quake-Konsole: Terminal erscheint beim ersten Öffnen automatisch
workspace = special:qconsole, on-created-empty:$terminal


