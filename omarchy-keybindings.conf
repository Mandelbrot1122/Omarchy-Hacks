bindd = SUPER SHIFT ALT, RIGHT, Arbeitsfläche auf rechten Monitor, movecurrentworkspacetomonitor, r
bindd = SUPER SHIFT ALT, UP, Arbeitsfläche auf oberen Monitor, movecurrentworkspacetomonitor, u
bindd = SUPER SHIFT ALT, DOWN, Arbeitsfläche auf unteren Monitor, movecurrentworkspacetomonitor, d
bindd = SUPER SHIFT CTRL, LEFT, Fenster auf linken Monitor, movewindow, mon:l
bindd = SUPER SHIFT CTRL, RIGHT, Fenster auf rechten Monitor, movewindow, mon:r
bindd = SUPER SHIFT CTRL, UP, Fenster auf oberen Monitor, movewindow, mon:u
bindd = SUPER SHIFT CTRL, DOWN, Fenster auf unteren Monitor, movewindow, mon:d
bindd = SUPER CTRL, DELETE, Laptop-Bildschirm umschalten, exec, $laptopDisplayToggle


# ============================================================================
#  Menüs und System
# ============================================================================
bindd = SUPER, SPACE, App-Starter, exec, pkill -x $menuBin || $launcher
bindd = SUPER ALT, SPACE, App-Starter, exec, pkill -x $menuBin || $launcher
bindd = SUPER, ESCAPE, Systemmenü, exec, pkill -x $menuBin || $powerMenu
bindld = , XF86PowerOff, Systemmenü, exec, pkill -x $menuBin || $powerMenu
bindd = SUPER, K, Tastenkürzel anzeigen, exec, pkill -x $menuBin || $keybindingsMenu
bindd = SUPER CTRL, E, Emojis, exec, $emojiPicker
bindd = SUPER SHIFT, SPACE, Leiste ein/aus (Waybar), exec, pkill -SIGUSR1 waybar
bindd = SUPER CTRL, I, Sperre bei Inaktivität umschalten, exec, $idleToggle
bindd = SUPER CTRL, L, Bildschirm sperren, exec, $lock

bindd = SUPER CTRL, A, Audio, exec, $audioControl
bindd = SUPER CTRL, B, Bluetooth, exec, $bluetoothControl
bindd = SUPER CTRL, N, Netzwerk, exec, $networkControl

bindd = SUPER CTRL ALT, T, Uhrzeit anzeigen, exec, notify-send "$(date +'%H:%M')" "$(date +'%A, %d. %B %Y')"
bindd = SUPER CTRL ALT, B, Akkustand anzeigen, exec, notify-send "Akku" "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1 || echo '?') %"
bindd = SUPER CTRL ALT, W, Wetter anzeigen, exec, notify-send "Wetter" "$(curl -fsS 'https://wttr.in/?format=3' || echo 'nicht verfügbar')"

bindd = SUPER CTRL, Z, Hineinzoomen, exec, $zoomIn
bindd = SUPER CTRL ALT, Z, Zoom zurücksetzen, exec, hyprctl keyword cursor:zoom_factor 1


# ============================================================================
#  Benachrichtigungen (mako oder swaync)
# ============================================================================
bindd = SUPER, comma, Letzte Benachrichtigung schließen, exec, $notifyDismiss
bindd = SUPER ALT, comma, Letzte Benachrichtigung schließen, exec, $notifyDismiss
bindd = SUPER SHIFT, comma, Alle Benachrichtigungen schließen, exec, makoctl dismiss --all 2>/dev/null || swaync-client --close-all
bindd = SUPER CTRL, comma, Aktion der Benachrichtigung ausführen, exec, makoctl invoke 2>/dev/null || swaync-client --open-panel
bindd = SUPER SHIFT ALT, comma, Benachrichtigungsverlauf, exec, makoctl restore 2>/dev/null || swaync-client --toggle-panel
bindd = SUPER CTRL ALT, comma, Nicht stören umschalten, exec, makoctl mode -t do-not-disturb 2>/dev/null || swaync-client --toggle-dnd


# ============================================================================
#  Bildschirmfoto, Aufnahme, Farbwähler
# ============================================================================
bindd = , PRINT, Bildschirmfoto, exec, $screenshot
bindd = SUPER CTRL ALT, C, Bildschirmfoto, exec, $screenshot
bindd = ALT, PRINT, Bildschirmaufnahme (mit Ton) starten/stoppen, exec, $screenrecordAudio
bindd = SUPER SHIFT CTRL ALT, C, Bildschirmaufnahme (ohne Ton) starten/stoppen, exec, $screenrecord
bindd = SUPER, PRINT, Farbwähler, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Text aus Bildschirmfoto erkennen (OCR), exec, $ocr


# ============================================================================
#  Lautstärke, Helligkeit, Medien (funktionieren auch im Sperrbildschirm)
# ============================================================================
bindeld = , XF86AudioRaiseVolume, Lauter, exec, $volumeUp
bindeld = , XF86AudioLowerVolume, Leiser, exec, $volumeDown
bindld = , XF86AudioMute, Stumm, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mikrofon stumm, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = ALT, XF86AudioRaiseVolume, Lauter (fein), exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindeld = ALT, XF86AudioLowerVolume, Leiser (fein), exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

bindeld = , XF86MonBrightnessUp, Heller, exec, brightnessctl -e4 -n2 set 5%+
bindeld = , XF86MonBrightnessDown, Dunkler, exec, brightnessctl -e4 -n2 set 5%-
bindeld = SHIFT, XF86MonBrightnessUp, Maximale Helligkeit, exec, brightnessctl set 100%
bindeld = SHIFT, XF86MonBrightnessDown, Minimale Helligkeit, exec, brightnessctl -n2 set 1%
bindeld = ALT, XF86MonBrightnessUp, Heller (fein), exec, brightnessctl -n2 set 1%+
bindeld = ALT, XF86MonBrightnessDown, Dunkler (fein), exec, brightnessctl -n2 set 1%-

bindeld = , XF86KbdBrightnessUp, Tastaturbeleuchtung heller, exec, brightnessctl -d '*::kbd_backlight' set 33%+
bindeld = , XF86KbdBrightnessDown, Tastaturbeleuchtung dunkler, exec, brightnessctl -d '*::kbd_backlight' set 33%-
bindeld = CTRL, XF86MonBrightnessUp, Tastaturbeleuchtung heller, exec, brightnessctl -d '*::kbd_backlight' set 33%+
bindeld = CTRL, XF86MonBrightnessDown, Tastaturbeleuchtung dunkler, exec, brightnessctl -d '*::kbd_backlight' set 33%-

bindld = , XF86AudioNext, Nächster Titel, exec, playerctl next
bindld = ALT, XF86AudioPlay, Nächster Titel, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Abspielen, exec, playerctl play-pause
bindld = , XF86AudioPrev, Vorheriger Titel, exec, playerctl previous
bindld = ALT SHIFT, XF86AudioPlay, Vorheriger Titel, exec, playerctl previous
bindld = SHIFT, XF86AudioPlay, Mediaplayer wechseln, exec, playerctld shift
bindld = SHIFT, XF86AudioPause, Mediaplayer wechseln, exec, playerctld shift
bindld = , XF86Eject, Medium auswerfen, exec, eject
