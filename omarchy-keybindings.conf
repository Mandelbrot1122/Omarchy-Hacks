# ============================================================================
#  Programme
# ============================================================================
bindd = SUPER, RETURN, Terminal, exec, $terminal
bindd = SUPER SHIFT, RETURN, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (privat), exec, $privateBrowser
bindd = SUPER SHIFT, F, Dateimanager, exec, $fileManager
bindd = SUPER ALT SHIFT, F, Dateimanager im aktuellen Ordner, exec, pid=$(hyprctl activewindow -j | jq -r '.pid'); child=$(pgrep -P "$pid" | tail -n1); cd "$(readlink "/proc/${child:-$pid}/cwd" 2>/dev/null || echo "$HOME")" && $fileManager .
bindd = SUPER SHIFT, N, Editor, exec, $editor
bindd = SUPER ALT, RETURN, Tmux, exec, $terminal -e tmux new-session -A -s Work
bindd = SUPER SHIFT, Q, Taschenrechner, exec, $calculator
bindd = , XF86Calculator, Taschenrechner, exec, $calculator
bindd = SUPER SHIFT, D, Docker (lazydocker), exec, $terminal -e lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, obsidian
bindd = SUPER SHIFT, slash, Passwörter (1Password), exec, 1password
bindd = SUPER SHIFT, T, Systemmonitor (btop), exec, $terminal -e btop

# Apps und Web-Apps (Omarchy-Standard, Region "global")
